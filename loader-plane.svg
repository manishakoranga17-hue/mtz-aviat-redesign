<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Main fuselage outline (nose pointing right) -->
  <path d="M 60 116
           Q 90 102 150 98
           L 640 98
           Q 700 98 740 105
           Q 770 110 790 116
           Q 770 122 740 127
           Q 700 134 640 134
           L 150 134
           Q 90 130 60 116 Z" />

  <!-- Tail tip cap (rear of fuselage) -->
  <path d="M 60 116 L 48 113 L 48 119 Z" />

  <!-- Cockpit windshield -->
  <path d="M 700 104 L 720 100 L 750 105 L 760 109" />
  <path d="M 712 109 L 728 105 L 748 109" />

  <!-- Passenger windows (dashed line down the cabin) -->
  <line x1="160" y1="111" x2="640" y2="111" stroke-dasharray="8 5" stroke-width="1.1" opacity="0.85" />

  <!-- Belly cross-section ribs (blueprint detail) -->
  <path d="M 220 134 Q 220 138 224 140" opacity="0.6" />
  <path d="M 320 134 Q 320 138 324 140" opacity="0.6" />
  <path d="M 420 134 Q 420 138 424 140" opacity="0.6" />
  <path d="M 520 134 Q 520 138 524 140" opacity="0.6" />

  <!-- Door outlines -->
  <path d="M 200 100 L 200 132 M 215 100 L 215 132" opacity="0.7" />
  <path d="M 600 100 L 600 132 M 615 100 L 615 132" opacity="0.7" />

  <!-- Vertical tail fin (rear-top) -->
  <path d="M 90 98
           L 90 56
           Q 92 50 100 50
           L 168 50
           Q 178 52 184 60
           L 196 98 Z" />
  <path d="M 110 50 L 168 50" opacity="0.6" />
  <path d="M 100 75 L 192 75" opacity="0.55" />

  <!-- Horizontal stabilizer (rear, swept back) -->
  <path d="M 70 116
           L 30 110
           Q 22 110 18 113
           L 22 119
           Q 30 122 70 117 Z" />
  <path d="M 28 113 L 64 116" opacity="0.55" />

  <!-- Main wing (foreshortened, sweeping back-down) -->
  <path d="M 470 134
           L 360 200
           Q 350 204 340 204
           L 280 200
           Q 274 198 274 192
           L 380 134 Z" />
  <!-- wing crease lines -->
  <path d="M 320 200 L 380 134" opacity="0.5" />
  <path d="M 350 168 L 430 165" opacity="0.5" />

  <!-- Wing-far side (peeking behind fuselage) -->
  <path d="M 460 134 L 510 175 L 540 174 L 500 134" opacity="0.7" />

  <!-- Engine pylon -->
  <path d="M 332 195 L 332 208" />
  <path d="M 348 196 L 348 208" />

  <!-- Engine cowling -->
  <ellipse cx="340" cy="218" rx="48" ry="13" />
  <ellipse cx="305" cy="218" rx="6" ry="11" opacity="0.75" />
  <line x1="305" y1="207" x2="305" y2="229" opacity="0.45" />
  <line x1="375" y1="208" x2="375" y2="228" opacity="0.4" />

  <!-- Engine fan blades hint -->
  <path d="M 300 213 L 310 218 L 300 223" opacity="0.55" />

  <!-- Nose landing-gear hint -->
  <path d="M 730 134 L 730 144 L 722 148 M 730 144 L 738 148" opacity="0.7" />

  <!-- Subtle blueprint center-line through fuselage -->
  <line x1="60" y1="116" x2="790" y2="116" opacity="0.18" stroke-dasharray="2 4" stroke-width="0.7" />
</svg>
