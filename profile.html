<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Menteiz Aviation Services</title>
  <meta name="description" content="Manage your Menteiz Aviation account profile, company details and contact preferences." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=227" />
</head>
<body class="page-dashboard">

  <div class="dash">
    <!-- ═════════════════════ SIDEBAR ═════════════════════ -->
    <aside class="dash__side">
      <a class="dash__logo" href="index.html">
        <img class="dash__logo-img" src="logo-mtz.png" alt="Menteiz Aviation" />
      </a>

      <ul class="dash__menu">
        <li>
          <a href="dashboard.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-3v-7H10v7H6a2 2 0 0 1-2-2v-9z"/>
            </svg>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a href="my-bookings.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="16" rx="2"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
              <line x1="8" y1="3" x2="8" y2="7"/>
              <line x1="16" y1="3" x2="16" y2="7"/>
              <path d="M8 15l3 3 5-5"/>
            </svg>
            <span>My Bookings</span>
          </a>
        </li>
        <li>
          <a href="managing-partners.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="8" r="3.5"/>
              <path d="M2 21c0-3.5 3.13-6 7-6s7 2.5 7 6"/>
              <circle cx="17" cy="9" r="2.5"/>
              <path d="M16 14.5c2.7 0 5 1.6 5 4.5"/>
            </svg>
            <span>Managing Partner</span>
          </a>
        </li>
        <li>
          <a href="my-wallet.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="6" width="20" height="13" rx="2"/>
              <path d="M16 12.5h2"/>
              <path d="M2 9h20"/>
            </svg>
            <span>My Wallet</span>
          </a>
        </li>
        <li>
          <a href="my-invoices.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
              <path d="M14 3v5h5"/>
              <line x1="9" y1="13" x2="15" y2="13"/>
              <line x1="9" y1="17" x2="13" y2="17"/>
            </svg>
            <span>My Invoice</span>
          </a>
        </li>
      </ul>

      <div class="dash__side-bot">
        <a href="profile.html" class="dash__menu-item is-active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
          </svg>
          <span>Profile</span>
        </a>
        <a href="index.html" class="dash__menu-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="M16 17l5-5-5-5"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span>Logout</span>
        </a>
      </div>
    </aside>

    <!-- ═════════════════════ MAIN ═════════════════════ -->
    <main class="dash__main">

      <!-- Top bar -->
      <header class="dash__topbar">
        <div class="dash__brand">
          <svg class="dash__brand-mark" viewBox="0 0 48 32" aria-hidden="true">
            <g fill="#DE1D2A">
              <path d="M14 16 L24 6 L34 16 L24 26 Z"/>
              <path d="M0 16 Q10 12 14 16 Q10 20 0 16 Z" opacity="0.85"/>
              <path d="M48 16 Q38 12 34 16 Q38 20 48 16 Z" opacity="0.85"/>
            </g>
            <rect x="20" y="12" width="8" height="8" rx="1" fill="#fff" stroke="#0a1f3d" stroke-width="0.6"/>
          </svg>
          <span class="dash__brand-name">MTZ <em>Track</em></span>
        </div>

        <div class="dash__search">
          <span class="dash__search-prefix">232-</span>
          <input type="text" placeholder="Enter 8-digit AWB number, e.g. 12345678" />
          <button class="dash__search-btn" aria-label="Track">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/>
              <line x1="21" y1="21" x2="16.5" y2="16.5"/>
            </svg>
          </button>
        </div>

        <button class="dash__user" type="button">
          <span class="dash__user-avatar">A</span>
          <span class="dash__user-name">Akshay Sharma</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </header>

      <h1 class="dash__page-title">Profile</h1>

      <!-- Profile summary -->
      <section class="dash__panel dash__profile-head">
        <span class="dash__profile-avatar" aria-hidden="true">A</span>
        <div class="dash__profile-id">
          <h2>Akshay Sharma</h2>
          <p>Account code <strong>INDDELDO</strong> &middot; Member since 2021</p>
        </div>
        <span class="dash__profile-badge">Platinum Member</span>
      </section>

      <!-- Account details -->
      <section class="dash__panel">
        <form class="dash__form" onsubmit="event.preventDefault();">
          <div class="dash__form-grid">
            <div class="dash__field">
              <label for="pfFirst">First name<span class="req">*</span></label>
              <div class="dash__control"><input id="pfFirst" type="text" class="dash__input" value="Akshay" /></div>
            </div>
            <div class="dash__field">
              <label for="pfLast">Last name<span class="req">*</span></label>
              <div class="dash__control"><input id="pfLast" type="text" class="dash__input" value="Sharma" /></div>
            </div>
            <div class="dash__field">
              <label for="pfEmail">Email<span class="req">*</span></label>
              <div class="dash__control"><input id="pfEmail" type="email" class="dash__input" value="akshay@example.com" /></div>
            </div>
            <div class="dash__field">
              <label for="pfPhone">Phone</label>
              <div class="dash__control"><input id="pfPhone" type="tel" class="dash__input" value="+60 12 345 6789" /></div>
            </div>
            <div class="dash__field">
              <label for="pfCompany">Company</label>
              <div class="dash__control"><input id="pfCompany" type="text" class="dash__input" value="Indo Delivery Sdn. Bhd." /></div>
            </div>
            <div class="dash__field">
              <label for="pfCode">Account code</label>
              <div class="dash__control"><input id="pfCode" type="text" class="dash__input" value="INDDELDO" readonly /></div>
            </div>
          </div>

          <div class="dash__form-grid dash__form-grid--single">
            <div class="dash__field">
              <label for="pfAddress">Billing address</label>
              <div class="dash__control"><input id="pfAddress" type="text" class="dash__input" value="32, Jalan Sepadu 25/123A, Seksyen 25, Selangor, Malaysia" /></div>
            </div>
          </div>

          <div class="dash__form-actions">
            <button type="submit" class="dash__btn-primary">Save changes</button>
            <button type="reset" class="dash__btn-ghost">Cancel</button>
          </div>
        </form>
      </section>

      <!-- Security -->
      <section class="dash__panel">
        <h3 class="dash__panel-title">Password &amp; security</h3>
        <form class="dash__form" onsubmit="event.preventDefault();">
          <div class="dash__form-grid">
            <div class="dash__field">
              <label for="pfCurrent">Current password</label>
              <div class="dash__control"><input id="pfCurrent" type="password" class="dash__input" placeholder="••••••••" /></div>
            </div>
            <div class="dash__field">
              <label for="pfNew">New password</label>
              <div class="dash__control"><input id="pfNew" type="password" class="dash__input" placeholder="••••••••" /></div>
            </div>
          </div>
          <div class="dash__form-actions">
            <button type="submit" class="dash__btn-primary">Update password</button>
          </div>
        </form>
      </section>

    </main>
  </div>

  <script src="main.js?v=180"></script>
</body>
</html>
